<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MiMi Messenger</title>
  <link rel="stylesheet" href="style.css?v=5.3">
</head>
<body>
  <div id="auth" class="screen">
    <div class="card">
      <h1>MiMi Messenger</h1>
      <p class="muted">Личный мессенджер</p>

      <input id="email" type="email" autocomplete="email" placeholder="Email">
      <input id="password" type="password" autocomplete="new-password" placeholder="Пароль">
      <input id="username" type="text" autocomplete="nickname" placeholder="Имя пользователя (для регистрации)">

      <button id="forgotPassword" type="button" class="linkBtn">Забыли пароль?</button>

      <div class="row">
        <button id="signup">Регистрация</button>
        <button id="login" class="secondary">Войти</button>
      </div>

      <div id="authMsg" class="msg"></div>

      <div id="resetPanel" class="resetPanel hidden">
        <h2>Новый пароль</h2>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="Новый пароль">
        <input id="newPassword2" type="password" autocomplete="new-password" placeholder="Повторите новый пароль">
        <button id="savePassword" type="button">Изменить пароль</button>
        <button id="cancelReset" type="button" class="secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sideTop">
        <div>
          <strong>MiMi Messenger</strong>
          <div id="me" class="muted small"></div><div id="e2eeStatus" class="muted small">🔐 E2EE</div><div id="notifyStatus" class="muted small"></div>
        </div>
        <div class="topActions"><button id="notifyBtn" class="iconBtn" title="Включить уведомления">🔔</button><button id="logout" class="iconBtn" title="Выйти">↪</button></div>
      </div>

      <input id="search" class="search" placeholder="Поиск пользователей...">
      <div id="users" class="users"></div>
    </aside>

    <main class="chat">
      <header id="chatHeader" class="chatHeader">Выберите пользователя</header>

      <section id="messages" class="messages">
        <div class="empty">Выберите пользователя слева, чтобы начать чат.</div>
      </section>

      <form id="sendForm" class="composer hidden">
        <button id="photoBtn" type="button" class="photoBtn" title="Отправить фото">📷</button>
        <input id="photoInput" type="file" accept="image/*" hidden>
        <input id="messageInput" autocomplete="off" placeholder="Написать сообщение...">
        <button type="submit">➤</button>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=5.3"></script>
</body>
</html>
